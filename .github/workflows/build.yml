name: Build ViTube and ViVibe

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # yt-dlp needs a JavaScript engine for YouTube. Build QuickJS-NG for Android
      # and ship it inside the APK as libqjs.so.
      - name: Build QuickJS for Android
        run: |
          set -e
          TAG=$(git ls-remote --tags --refs https://github.com/quickjs-ng/quickjs.git | awk -F/ '{print $3}' | grep -E '^v[0-9]' | sort -V | tail -1)
          echo "QuickJS-NG $TAG"
          git clone --depth 1 --branch "$TAG" https://github.com/quickjs-ng/quickjs.git qjs-src
          for ABI in arm64-v8a armeabi-v7a; do
            (
              cmake -S qjs-src -B "qjs-$ABI" \
                -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake" \
                -DANDROID_ABI="$ABI" -DANDROID_PLATFORM=android-29 -DCMAKE_BUILD_TYPE=Release
              cmake --build "qjs-$ABI" --target qjs -j4
              mkdir -p "app/src/main/jniLibs/$ABI"
              cp "qjs-$ABI/qjs" "app/src/main/jniLibs/$ABI/libqjs.so"
              echo "Built QuickJS for $ABI"
            ) || echo "::warning::QuickJS build failed for $ABI; that APK will run without a JS engine"
          done
          ls -la app/src/main/jniLibs/*/

      - name: Restore signing key
        env:
          KS: ${{ secrets.VIYT_KEYSTORE_B64 }}
        run: |
          if [ -z "$KS" ]; then echo "::error::Add the VIYT_KEYSTORE_B64 and VIYT_STORE_PASSWORD repository secrets"; exit 1; fi
          mkdir -p signing && echo "$KS" | base64 -d > signing/viyt.jks

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      # Tests first: a failing test stops the release.
      - name: Run unit tests
        env:
          VIYT_STORE_PASSWORD: ${{ secrets.VIYT_STORE_PASSWORD }}
        run: gradle testTubeReleaseUnitTest --stacktrace

      - name: Build APKs
        env:
          VIYT_VERSION_CODE: ${{ github.run_number }}
          VIYT_STORE_PASSWORD: ${{ secrets.VIYT_STORE_PASSWORD }}
        run: gradle assembleTubeRelease assembleVibeRelease --stacktrace

      - name: Rename APKs
        run: |
          mkdir -p out
          for app in tube vibe; do
            name=$([ "$app" = tube ] && echo ViTube || echo ViVibe)
            for f in app/build/outputs/apk/$app/release/*.apk; do
              abi=$(basename "$f" | sed -E "s/app-$app-(.*)-release\.apk/\1/")
              cp "$f" "out/$name-1.0.${{ github.run_number }}-$abi.apk"
            done
          done
          ls -la out

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: out/*.apk

      # Publish a release so the APK can be downloaded straight from a phone browser.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: ViTube + ViVibe 1.0.${{ github.run_number }}
          body: |
            Two apps: **ViTube** (YouTube) and **ViVibe** (YouTube Music). Install both if you want both.
            On most modern phones (Moto G86 included) use the **arm64-v8a** APKs:
            ViTube-…-arm64-v8a.apk and ViVibe-…-arm64-v8a.apk.
            Use the armeabi-v7a APKs only on older 32-bit phones.
          files: out/*.apk
